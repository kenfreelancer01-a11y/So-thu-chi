<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c2530;--mut:#6b7785;--line:#e6e9ee;--pri:#0f9d7a;--in:#0f9d7a;--out:#e5484d;--warn:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2128;--tx:#e8edf2;--mut:#93a0ae;--line:#2a323b;--pri:#2cc29c;--in:#2cc29c;--out:#ff6b70;--warn:#f0b03a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2128;--tx:#e8edf2;--mut:#93a0ae;--line:#2a323b;--pri:#2cc29c;--in:#2cc29c;--out:#ff6b70;--warn:#f0b03a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding-bottom:150px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:17px}
.mb{display:flex;align-items:center;gap:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 14px 12px;padding:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.sum small{display:block;color:var(--mut);font-size:12px}
.sum b{font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .h{font-size:11px;color:var(--mut);padding:2px 0}
.d{min-height:46px;border-radius:8px;padding:2px 0;font-size:12px;border:1px solid transparent}
.d i{display:block;font-style:normal;font-size:9px;line-height:1.15;overflow:hidden}
.d.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.d.td{font-weight:700;color:var(--pri)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;flex:none;font-weight:600}
.grow{flex:1;min-width:0}
.grow small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px;border-radius:8px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav{overflow-x:auto}
nav button{flex:1 0 auto;min-width:70px;padding:10px 0;font-size:12px;color:var(--mut)}
nav button span{display:block;font-size:19px}
nav button.on{color:var(--pri);font-weight:600}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50% - 222px));width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:7}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.bar div{height:100%;background:var(--pri)}
.chip{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.chip.es{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-color:var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{padding:8px 2px;border:1px solid var(--line);border-radius:10px;font-size:12px}
.cats button.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent)}
.pri{width:100%;background:var(--pri);color:#fff;padding:12px;border-radius:12px;margin-top:14px;font-weight:600}
.sm{font-size:12px;color:var(--pri);padding:4px 8px;border:1px solid var(--pri);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;border-top:0}
.mut{color:var(--mut);font-size:13px}.c{text-align:center;padding:18px 0}
svg{max-width:100%}
</style>
</head>
<body>
<div id="app">
<header><b>Sổ Thu Chi</b><div class="mb"><button class="ic" id="sy" onclick="sync()" title="Đồng bộ">⟳</button><button class="ic" onclick="mv(-1)">‹</button><span id="ml" style="min-width:84px;text-align:center"></span><button class="ic" onclick="mv(1)">›</button></div></header>
<main id="main"></main>
</div>
<button class="fab" id="fab" onclick="addTx()">+</button>
<nav><button data-t="log" onclick="tab('log')"><span>📒</span>Sổ</button><button data-t="stat" onclick="tab('stat')"><span>📊</span>Thống kê</button><button data-t="bal" onclick="tab('bal')"><span>💵</span>Số dư</button><button data-t="sav" onclick="tab('sav')"><span>🏦</span>Tiết kiệm</button><button data-t="plan" onclick="tab('plan')"><span>📈</span>Tổng quan</button><button data-t="loan" onclick="tab('loan')"><span>🤝</span>Vay nợ</button><button data-t="fam" onclick="tab('fam')"><span>👨‍👩‍👧</span>Gia đình</button></nav>
<div id="modal"></div>
<script>
var OUT=['Ăn uống','Nhà ở','Điện nước','Di chuyển','Học tập','Y tế','Mua sắm','Giải trí','Du lịch','Phụng dưỡng','Khác'];
var INC=['Lương','Thưởng','Kinh doanh','Lãi','Khác'];
var EMO={'Ăn uống':'🍜','Nhà ở':'🏠','Điện nước':'💡','Di chuyển':'🛵','Học tập':'📚','Y tế':'💊','Mua sắm':'🛍️','Giải trí':'🎮','Du lịch':'✈️','Khác':'📦','Phụng dưỡng':'🧓','Lương':'💰','Thưởng':'🎁','Kinh doanh':'🏪','Lãi':'📈'};
var COL=['#e5484d','#f08a24','#e5b800','#3fb950','#12a594','#3e8ed0','#7a5af8','#d6409f','#8b6f4e','#6b7785'];
var S={tx:[],loans:[],ess:{'Ăn uống':1,'Nhà ở':1,'Điện nước':1,'Di chuyển':1,'Y tế':1,'Học tập':1,'Phụng dưỡng':1}};
try{var raw=localStorage.getItem('sotc1');if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem('sotc1',JSON.stringify(S))}catch(e){}}
S.members=S.members||[];S.sv=S.sv||[];S.plan=S.plan||{};
if(!S.me)S.me='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
S.tx.forEach(function(t){if(!t.by||t.by=='me')t.by=S.me});S.loans.forEach(function(l){if(!l.by||l.by=='me')l.by=S.me});S.members.forEach(function(m){if(m.id=='me')m.id=S.me});
if(!S.members.some(function(m){return m.id==S.me}))S.members.unshift({id:S.me,name:'Tôi',role:'Khác'});
save();
var DB=null,UID=S.me,ME=S.me,FM='all',ASK=false,OWN=false,GATE='load',UN={},TXB={},LNB={},ST='Chế độ cục bộ: dữ liệu chỉ lưu trên máy này.';
var ROLES=['Chồng','Vợ','Con','Bố','Mẹ','Khác'];
function hm(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function pth(c,o){return(c=='tx'||c=='loans')?c+'/'+o.by+'/items/'+o.id:c+'/'+o.id}
function put(c,o){if(!DB){save();return}var d=Object.assign({},o);delete d.id;DB.doc(pth(c,o)).set(d).catch(function(){ST='Ghi dữ liệu thất bại (bạn chỉ được sửa dữ liệu của chính mình).';render()})}
function rm(c,o){if(!DB){save();return}DB.doc(pth(c,o)).delete().catch(function(){ST='Xoá thất bại (bạn chỉ được xoá dữ liệu của chính mình).';render()})}
function rws(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data())})}
function mine(id){var m=S.members.filter(function(x){return x.id==id})[0];return id==ME||!!(m&&m.c==ME)}
function canEd(id){return mine(id)}
function dt(){var d=new Date();return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+hm().slice(0,5)}
function fname(){var m=S.members.filter(function(x){return x.id==ME})[0];return 'so-thu-chi-'+((m?m.name:'')||'tai-khoan').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^\w]+/g,'-')+'.json'}
function pack(){return JSON.stringify({app:'so-thu-chi',v:2,from:ME,at:new Date().toISOString(),members:S.members.filter(function(m){return mine(m.id)}),tx:S.tx.filter(function(t){return mine(t.by)}),loans:S.loans.filter(function(l){return mine(l.by)}),sv:S.sv.filter(function(v){return mine(v.by)})})}
async function bak(mode){
  var fn=fname(),data=pack();
  try{
    if(mode=='share'){await navigator.share({files:[new File([data],fn,{type:'application/json'})],title:'Sao lưu Sổ Thu Chi'})}
    else{
      var dl=window.claude&&await claude.use('downloads');
      if(dl)await dl.save({filename:fn,data:data});
      else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
    }
    S.lastBk=dt();save();syncSheet();render();
  }catch(e){if(e&&e.name=='AbortError')return;alert('Không sao lưu được: '+((e&&e.message)||e))}
}
function syncSheet(){
  sheet('<b>Sao lưu &amp; đồng bộ</b><p class="mut">Mỗi người sao lưu dữ liệu của mình ra 1 file rồi gửi cho người kia (Zalo, Messenger, email…). Người nhận chọn file để đồng bộ: dữ liệu của người gửi được cập nhật, dữ liệu của chính họ giữ nguyên.</p><label>1. Sao lưu dữ liệu của bạn'+(S.lastBk?' (lần cuối '+S.lastBk+')':'')+'</label><button class="pri" style="margin-top:4px" onclick="bak()">⬇ Tải file sao lưu</button>'+(navigator.canShare?'<button class="pri" style="background:var(--bg);color:var(--tx);border:1px solid var(--line);margin-top:8px" onclick="bak(\'share\')">Gửi qua ứng dụng khác</button>':'')+'<label>2. Đồng bộ từ file của người khác'+(S.lastSy?' (lần cuối '+S.lastSy+')':'')+'</label><input type="file" accept=".json,application/json" onchange="impFile(this)"><label>3. Xuất dữ liệu ra Excel</label><button class="pri" style="margin-top:4px" onclick="exportX()">📊 Xuất file Excel (.xlsx)</button><p class="mut" id="imsg">'+(window.IMSG||'')+'</p>');
  window.IMSG='';
}
function loadX(){return new Promise(function(ok,no){if(window.XLSX)return ok();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function saveFile(fn,data,type){
  var dl=window.claude&&await claude.use('downloads');
  if(dl)return dl.save({filename:fn,data:data});
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
}
function sheetsData(){
  var nm=function(id){var m=S.members.filter(function(x){return x.id==id})[0];return m?m.name:''};
  var tx=S.tx.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).map(function(t){return[t.date,t.type=='in'?'Thu':'Chi',t.cat,t.amt,nm(t.by),t.note||'']});
  var mo={},ct={};
  S.tx.forEach(function(t){var k=t.date.slice(0,7);mo[k]=mo[k]||{i:0,o:0};mo[k][t.type=='in'?'i':'o']+=t.amt;if(t.type=='out')ct[t.cat]=(ct[t.cat]||0)+t.amt});
  var mr=Object.keys(mo).sort().map(function(k){return[k,mo[k].i,mo[k].o,mo[k].i-mo[k].o]});
  var cr=Object.keys(ct).sort(function(a,b){return ct[b]-ct[a]}).map(function(c){return[c,ct[c],S.ess[c]?'Có':'Không']});
  var ln=S.loans.map(function(l){var p=paid(l);return[l.kind=='lend'?'Cho vay':'Đi vay',l.who,l.amt,p,l.amt-p,l.date,l.due||'',l.note||'',nm(l.by)]});
  var sv=S.sv.map(function(v){return[v.name,v.amt,v.rate,v.term,v.date,mat(v),Math.round(svVal(v)),v.closed?'Đã tất toán':'Đang gửi',nm(v.by)]});
  return[['Giao dịch',['Ngày','Loại','Hạng mục','Số tiền','Thành viên','Ghi chú'],tx],['Theo tháng',['Tháng','Thu','Chi','Còn dư'],mr],['Theo hạng mục',['Hạng mục','Tổng chi','Thiết yếu'],cr],['Vay nợ',['Loại','Người vay/cho vay','Số tiền','Đã trả/nhận','Còn lại','Ngày vay','Hạn trả','Ghi chú','Thành viên'],ln],['Tiết kiệm',['Tên sổ','Số tiền gửi','Lãi suất %/năm','Kỳ hạn (tháng)','Ngày gửi','Đáo hạn','Giá trị hiện tại','Trạng thái','Thành viên'],sv]];
}
async function exportX(){
  var D=sheetsData();
  try{
    await loadX();
    var wb=XLSX.utils.book_new();
    D.forEach(function(x){var ws=XLSX.utils.aoa_to_sheet([x[1]].concat(x[2]));ws['!cols']=x[1].map(function(){return{wch:18}});XLSX.utils.book_append_sheet(wb,ws,x[0])});
    await saveFile('so-thu-chi-'+TODAY+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }catch(e){
    if(e&&e.name=='AbortError')return;
    try{
      var csv='\ufeff'+[D[0][1]].concat(D[0][2]).map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
      await saveFile('so-thu-chi-giao-dich-'+TODAY+'.csv',csv,'text/csv;charset=utf-8');
      alert('Không tải được thư viện Excel (cần kết nối Internet) nên đã xuất file CSV các giao dịch. Excel mở được file này.');
    }catch(e2){alert('Không xuất được file: '+((e2&&e2.message)||e2))}
  }
}
var STASH=null;
function restoreAs(nid){
  var o=ME,f=function(a){return a.filter(function(x){return x.by==o}).map(function(x){return Object.assign({},x,{by:nid})})};
  STASH={tx:f(S.tx),loans:f(S.loans),sv:f(S.sv)};
  S.tx=S.tx.filter(function(x){return x.by!=o});S.loans=S.loans.filter(function(x){return x.by!=o});S.sv=S.sv.filter(function(x){return x.by!=o});
  S.members.forEach(function(m){if(m.c==o)m.c=nid});
  S.members=S.members.filter(function(m){return m.id!=o});
  ME=UID=S.me=nid;
}
function delMember(id){
  var ids=[id].concat(S.members.filter(function(m){return m.c==id}).map(function(m){return m.id}));
  if(!confirm('Xoá thành viên này cùng toàn bộ giao dịch, khoản vay và sổ tiết kiệm của họ khỏi máy này?'))return;
  var k=function(a){return a.filter(function(x){return ids.indexOf(x.by)<0})};
  S.tx=k(S.tx);S.loans=k(S.loans);S.sv=k(S.sv);
  S.members=S.members.filter(function(m){return ids.indexOf(m.id)<0});
  if(FM!='all'&&ids.indexOf(FM)>=0)FM='all';
  save();cl();render();
}
function impFile(inp){
  var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);if(d.app!='so-thu-chi'||!d.members||!d.tx)throw 0;
      if(d.from&&d.from!=ME){var fm=d.members.filter(function(m){return m.id==d.from})[0];
        if(confirm('File này của "'+(fm?fm.name:'?')+'".\n\nBấm OK nếu đây là dữ liệu CỦA BẠN (khôi phục sang máy này, không tạo thêm tài khoản; dữ liệu bạn đã nhập trên máy này vẫn được giữ).\nBấm Huỷ nếu là dữ liệu của người khác (chỉ đồng bộ).'))restoreAs(d.from)}
      var own=d.members.map(function(m){return m.id}).filter(function(id){return d.from==ME||!mine(id)});
      var ms=d.members.filter(function(m){return own.indexOf(m.id)>=0}),nt=0,nl=0;
      if(!ms.length){document.getElementById('imsg').textContent='File này là dữ liệu của chính bạn nên không có gì để cập nhật.';return}
      S.tx=S.tx.filter(function(t){return own.indexOf(t.by)<0});S.loans=S.loans.filter(function(l){return own.indexOf(l.by)<0});
      d.tx.forEach(function(t){if(own.indexOf(t.by)>=0){S.tx.push(t);nt++}});
      (d.loans||[]).forEach(function(l){if(own.indexOf(l.by)>=0){S.loans.push(l);nl++}});S.sv=S.sv.filter(function(v){return own.indexOf(v.by)<0});(d.sv||[]).forEach(function(v){if(own.indexOf(v.by)>=0)S.sv.push(v)});
      if(STASH){[['tx','by'],['loans','by'],['sv','by']].forEach(function(p){STASH[p[0]].forEach(function(x){if(!S[p[0]].some(function(y){return y.id==x.id&&y.by==x.by}))S[p[0]].push(x)})});STASH=null}
      ms.forEach(function(m){var i=S.members.map(function(x){return x.id}).indexOf(m.id);if(i>=0)S.members[i]=m;else S.members.push(m)});
      S.lastSy=dt();save();render();
      window.IMSG='✓ Đã cập nhật '+ms.map(function(m){return m.name}).join(', ')+': '+nt+' giao dịch, '+nl+' khoản vay.';syncSheet();
    }catch(e){document.getElementById('imsg').textContent='File không hợp lệ. Hãy chọn đúng file sao lưu của Sổ Thu Chi.'}
  };
  r.readAsText(f);
}
function join(){var f=function(B){return[].concat.apply([],Object.keys(B).map(function(k){return B[k]}))};S.tx=f(TXB);S.loans=f(LNB)}
function bag(c,id,s){(c=='tx'?TXB:LNB)[id]=rws(s).map(function(o){o.by=id;return o})}
function subMem(){
  var ids=S.members.map(function(m){return m.id});
  Object.keys(UN).forEach(function(k){var id=k.split('|')[1];if(ids.indexOf(id)<0){UN[k]();delete UN[k];delete TXB[id];delete LNB[id]}});
  ids.forEach(function(id){['tx','loans'].forEach(function(c){var k=c+'|'+id;if(UN[k])return;
    UN[k]=DB.collection(c+'/'+id+'/items').onSnapshot(function(s){bag(c,id,s);join();ok()},function(){ST='Mất kết nối đồng bộ.';render()})})});
  join();

function regular(c){
  var vals=[],k;
  for(k=0;k<3;k++){var d=new Date(Y,M-k,1);vals.push(sum(ftx(d.getFullYear(),d.getMonth()).filter(function(t){return t.cat==c}),'out'))}
  if(vals.some(function(v){return v<=0}))return false;
  var mean=(vals[0]+vals[1]+vals[2])/3,sd=Math.sqrt(vals.reduce(function(s,v){return s+(v-mean)*(v-mean)},0)/3);
  return sd/mean<0.35;
}

  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Giả định</b>'+(OVM=='all'?'<button class="sm" onclick="planSheet()">Chỉnh</button>':'')+'</div><p class="mut" style="margin:6px 0 0">'+(P.i!=null||P.e!=null||P.o!=null?'Có chỉnh tay. ':'Trung bình '+A.n+' tháng gần nhất (gồm tháng này, tính theo số ngày đã qua). ')+'Lương '+vnd(I)+' · thiết yếu '+vnd(E)+' · khác '+vnd(O)+' mỗi tháng.'+(I==0?' Chưa có khoản thu hạng mục “Lương” nên thu dự kiến = 0: hãy ghi lương hoặc bấm Chỉnh để nhập tay.':' Thu nhập chỉ tính lương, các khoản thu khác không cố định nên không đưa vào.')+(g||f?' Thu tăng '+g+'%/năm, chi tăng '+f+'%/năm.':'')+'</p>'+(Object.keys(S.ess).length?'<p class="mut" style="margin:6px 0 0">Hạng mục thiết yếu: '+Object.keys(S.ess).map(esc).join(', ')+'.</p>':'<p class="mut" style="margin:6px 0 0">Chưa có hạng mục thiết yếu: vào Thống kê để đánh dấu.</p>')+'<p class="mut" style="margin:6px 0 0">Dự đoán tính trên dữ liệu '+(OVM=='all'?'cả gia đình':'riêng tài khoản này')+', chưa gồm lãi sổ tiết kiệm và vay nợ.</p></div>';
  h+='<div class="card" style="overflow-x:auto"><table><tr><th>Tháng</th><th>Thu</th><th>Thiết yếu</th><th>Khác</th><th>Dư</th><th>Số dư</th></tr>';
  rows.forEach(function(r){h+='<tr><td>'+r.l+'</td><td class="in">'+sh(r.i)+'</td><td>'+sh(r.e)+'</td><td>'+sh(r.o)+'</td><td class="'+(r.n<0?'out':'in')+'">'+sg(r.n)+'</td><td class="'+(r.b<0?'out':'')+'"><b>'+sg(r.b)+'</b></td></tr>'});
  return h+'</table></div>';
}
