<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1c2530;--mut:#6b7785;--line:#e6e9ee;--pri:#0f9d7a;--in:#0f9d7a;--out:#e5484d;--warn:#d98a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1b2128;--tx:#e8edf2;--mut:#93a0ae;--line:#2a323b;--pri:#2cc29c;--in:#2cc29c;--out:#ff6b70;--warn:#f0b03a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1b2128;--tx:#e8edf2;--mut:#93a0ae;--line:#2a323b;--pri:#2cc29c;--in:#2cc29c;--out:#ff6b70;--warn:#f0b03a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding-bottom:150px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:17px}
.mb{display:flex;align-items:center;gap:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ic{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 14px 12px;padding:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.sum small{display:block;color:var(--mut);font-size:12px}
.sum b{font-size:14px}
.in{color:var(--in)}.out{color:var(--out)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .h{font-size:11px;color:var(--mut);padding:2px 0}
.d{min-height:46px;border-radius:8px;padding:2px 0;font-size:12px;border:1px solid transparent}
.d i{display:block;font-style:normal;font-size:9px;line-height:1.15;overflow:hidden}
.d.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.d.td{font-weight:700;color:var(--pri)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;flex:none;font-weight:600}
.grow{flex:1;min-width:0}
.grow small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px;border-radius:8px;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav{overflow-x:auto}
nav button{flex:1;min-width:0;padding:10px 0;font-size:12px;color:var(--mut)}
nav button span{display:block;font-size:19px}
nav button.on{color:var(--pri);font-weight:600}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));right:max(18px,calc(50% - 222px));width:54px;height:54px;border-radius:50%;background:var(--pri);color:#fff;font-size:28px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:7}
.fab2{position:fixed;bottom:calc(140px + env(safe-area-inset-bottom,0px));right:max(22px,calc(50% - 218px));width:46px;height:46px;border-radius:50%;background:#1a1f71;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:7;display:grid;place-items:center}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.bar div{height:100%;background:var(--pri)}
.chip{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.chip.es{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-color:var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cats button{padding:8px 2px;border:1px solid var(--line);border-radius:10px;font-size:12px}
.cats button.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,transparent)}
.pri{width:100%;background:var(--pri);color:#fff;padding:12px;border-radius:12px;margin-top:14px;font-weight:600}
.sm{font-size:12px;color:var(--pri);padding:4px 8px;border:1px solid var(--pri);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:500;border-top:0}
.mut{color:var(--mut);font-size:13px}.c{text-align:center;padding:18px 0}
svg{max-width:100%}
</style>

<nav><button data-t="log" onclick="tab('log')"><span>📒</span>Sổ</button><button data-t="stat" onclick="tab('stat')"><span>📊</span>Thống kê</button><button data-t="bal" onclick="tab('bal')"><span>💵</span>Số dư</button><button data-t="cc" onclick="tab('cc')"><span>💳</span>Tín dụng</button><button data-t="inv" onclick="tab('inv')"><span>💼</span>Đầu tư</button><button data-t="sav" onclick="tab('sav')"><span>🏦</span>Tiết kiệm</button><button data-t="plan" onclick="tab('plan')"><span>📈</span>Tổng quan</button><button data-t="loan" onclick="tab('loan')"><span>🤝</span>Vay nợ</button><button data-t="fam" onclick="tab('fam')"><span>👨‍👩‍👧</span>Gia đình</button></nav>
<div id="modal"></div>
<script>
var OUT=['Ăn uống','Nhà ở','Điện nước','Di chuyển','Học tập','Y tế','Mua sắm','Giải trí','Du lịch','Phụng dưỡng','Khác'];
var INC=['Lương','Thưởng','Kinh doanh','Lãi','Khác'];
var EMO={'Ăn uống':'🍜','Nhà ở':'🏠','Điện nước':'💡','Di chuyển':'🛵','Học tập':'📚','Y tế':'💊','Mua sắm':'🛍️','Giải trí':'🎮','Du lịch':'✈️','Khác':'📦','Phụng dưỡng':'🧓','Lương':'💰','Thưởng':'🎁','Kinh doanh':'🏪','Lãi':'📈'};
var COL=['#e5484d','#f08a24','#e5b800','#3fb950','#12a594','#3e8ed0','#7a5af8','#d6409f','#8b6f4e','#6b7785'];
var S={tx:[],loans:[],ess:{'Ăn uống':1,'Nhà ở':1,'Điện nước':1,'Di chuyển':1,'Y tế':1,'Học tập':1,'Phụng dưỡng':1}};
try{var raw=localStorage.getItem('sotc1');if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem('sotc1',JSON.stringify(S))}catch(e){}}
S.members=S.members||[];S.sv=S.sv||[];S.plan=S.plan||{};S.cc=S.cc||[];S.inv=S.inv||[];S.cats=S.cats||{out:[],in:[]};S.cats.out.concat(S.cats.in).forEach(function(c){EMO[c.n]=c.e});
if(!S.me)S.me='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
S.tx.forEach(function(t){if(!t.by||t.by=='me')t.by=S.me});S.loans.forEach(function(l){if(!l.by||l.by=='me')l.by=S.me});S.members.forEach(function(m){if(m.id=='me')m.id=S.me});
if(!S.members.some(function(m){return m.id==S.me}))S.members.unshift({id:S.me,name:'Tôi',role:'Khác'});
save();
var DB=null,UID=S.me,ME=S.me,FM='all',ASK=false,OWN=false,GATE='load',UN={},TXB={},LNB={},ST='Chế độ cục bộ: dữ liệu chỉ lưu trên máy này.';
var ROLES=['Chồng','Vợ','Con','Bố','Mẹ','Khác'];
function hm(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function pth(c,o){return(c=='tx'||c=='loans')?c+'/'+o.by+'/items/'+o.id:c+'/'+o.id}
function put(c,o){if(!DB){save();return}var d=Object.assign({},o);delete d.id;DB.doc(pth(c,o)).set(d).catch(function(){ST='Ghi dữ liệu thất bại (bạn chỉ được sửa dữ liệu của chính mình).';render()})}
function rm(c,o){if(!DB){save();return}DB.doc(pth(c,o)).delete().catch(function(){ST='Xoá thất bại (bạn chỉ được xoá dữ liệu của chính mình).';render()})}
function rws(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data())})}
function mine(id){var m=S.members.filter(function(x){return x.id==id})[0];return id==ME||!!(m&&m.c==ME)}
function canEd(id){return mine(id)}
function dt(){var d=new Date();return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+hm().slice(0,5)}
function fname(){var m=S.members.filter(function(x){return x.id==ME})[0];return 'so-thu-chi-'+((m?m.name:'')||'tai-khoan').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^\w]+/g,'-')+'.json'}
function pack(){return JSON.stringify({app:'so-thu-chi',v:2,from:ME,at:new Date().toISOString(),members:S.members.filter(function(m){return mine(m.id)}),tx:S.tx.filter(function(t){return mine(t.by)}),loans:S.loans.filter(function(l){return mine(l.by)}),sv:S.sv.filter(function(v){return mine(v.by)}),cats:S.cats,cc:S.cc.filter(function(x){return mine(x.by)}),inv:S.inv.filter(function(x){return mine(x.by)})})}
async function bak(mode){
  var fn=fname(),data=pack();
  try{
    if(mode=='share'){await navigator.share({files:[new File([data],fn,{type:'application/json'})],title:'Sao lưu Sổ Thu Chi'})}
    else{
      var dl=window.claude&&await claude.use('downloads');
      if(dl)await dl.save({filename:fn,data:data});
      else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
    }
    S.lastBk=dt();save();syncSheet();render();
  }catch(e){if(e&&e.name=='AbortError')return;alert('Không sao lưu được: '+((e&&e.message)||e))}
}
function syncSheet(){
  sheet('<b>Sao lưu &amp; đồng bộ</b><button class="pri" style="margin:8px 0" onclick="driveSheet()">☁ Sao lưu / đồng bộ qua Google Drive</button><p class="mut">Mỗi người sao lưu dữ liệu của mình ra 1 file rồi gửi cho người kia (Zalo, Messenger, email…). Người nhận chọn file để đồng bộ: dữ liệu của người gửi được cập nhật, dữ liệu của chính họ giữ nguyên.</p><label>1. Sao lưu dữ liệu của bạn'+(S.lastBk?' (lần cuối '+S.lastBk+')':'')+'</label><button class="pri" style="margin-top:4px" onclick="bak()">⬇ Tải file sao lưu</button>'+(navigator.canShare?'<button class="pri" style="background:var(--bg);color:var(--tx);border:1px solid var(--line);margin-top:8px" onclick="bak(\'share\')">Gửi qua ứng dụng khác</button>':'')+'<label>2. Đồng bộ từ file của người khác'+(S.lastSy?' (lần cuối '+S.lastSy+')':'')+'</label><input type="file" accept=".json,application/json" onchange="impFile(this)"><label>3. Xuất dữ liệu ra Excel</label><button class="pri" style="margin-top:4px" onclick="exportX()">📊 Xuất file Excel (.xlsx)</button><p class="mut" id="imsg">'+(window.IMSG||'')+'</p>');
  window.IMSG='';
}
function loadX(){return new Promise(function(ok,no){if(window.XLSX)return ok();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function saveFile(fn,data,type){
  var dl=window.claude&&await claude.use('downloads');
  if(dl)return dl.save({filename:fn,data:data});
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
}
function sheetsData(){
  var nm=function(id){var m=S.members.filter(function(x){return x.id==id})[0];return m?m.name:''};
  var tx=S.tx.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).map(function(t){return[t.date,t.type=='in'?'Thu':'Chi',t.cat,t.amt,nm(t.by),t.note||'']});
  var mo={},ct={};
  S.tx.forEach(function(t){var k=t.date.slice(0,7);mo[k]=mo[k]||{i:0,o:0};mo[k][t.type=='in'?'i':'o']+=t.amt;if(t.type=='out')ct[t.cat]=(ct[t.cat]||0)+t.amt});
  var mr=Object.keys(mo).sort().map(function(k){return[k,mo[k].i,mo[k].o,mo[k].i-mo[k].o]});
  var cr=Object.keys(ct).sort(function(a,b){return ct[b]-ct[a]}).map(function(c){return[c,ct[c],S.ess[c]?'Có':'Không']});
  var ln=S.loans.map(function(l){var p=paid(l);return[l.kind=='lend'?'Cho vay':'Đi vay',l.who,l.amt,p,l.amt-p,l.date,l.due||'',l.note||'',nm(l.by)]});
  var sv=S.sv.map(function(v){return[v.name,v.amt,v.rate,v.term,v.date,mat(v),Math.round(svVal(v)),v.closed?'Đã tất toán':'Đang gửi',nm(v.by)]});
  return[['Giao dịch',['Ngày','Loại','Hạng mục','Số tiền','Thành viên','Ghi chú'],tx],['Theo tháng',['Tháng','Thu','Chi','Còn dư'],mr],['Theo hạng mục',['Hạng mục','Tổng chi','Thiết yếu'],cr],['Vay nợ',['Loại','Người vay/cho vay','Số tiền','Đã trả/nhận','Còn lại','Ngày vay','Hạn trả','Ghi chú','Thành viên'],ln],['Tiết kiệm',['Tên sổ','Số tiền gửi','Lãi suất %/năm','Kỳ hạn (tháng)','Ngày gửi','Đáo hạn','Giá trị hiện tại','Trạng thái','Thành viên'],sv]];
}
async function exportX(){
  var D=sheetsData();D.push(['Đầu tư',['Dự án','Loại','Ngày','Số tiền','Ghi chú','Liên quan số dư','Thành viên'],S.inv.reduce(function(a,p){var m=S.members.filter(function(x){return x.id==p.by})[0];return a.concat(p.ents.map(function(e){return[p.name,e.t=='cap'?'Vốn đầu tư':'Thu nhập',e.date,e.amt,e.note||'',e.bal?(e.t=='cap'?'Trừ số dư':'Cộng số dư'):'Không',m?m.name:'']}))},[])]);D.push(['Tín dụng',['Ngày','Hạng mục','Số tiền','Ghi chú','Thành viên','Trạng thái'],S.cc.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(c){var m=S.members.filter(function(x){return x.id==c.by})[0];return[c.date,c.cat,c.amt,c.note||'',m?m.name:'',c.p?'Đã tất toán '+(c.pd||''):'Chưa tất toán']})]);
  try{
    await loadX();
    var wb=XLSX.utils.book_new();
    D.forEach(function(x){var ws=XLSX.utils.aoa_to_sheet([x[1]].concat(x[2]));ws['!cols']=x[1].map(function(){return{wch:18}});XLSX.utils.book_append_sheet(wb,ws,x[0])});
    await saveFile('so-thu-chi-'+TODAY+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }catch(e){
    if(e&&e.name=='AbortError')return;
    try{
      var csv='\ufeff'+[D[0][1]].concat(D[0][2]).map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
      await saveFile('so-thu-chi-giao-dich-'+TODAY+'.csv',csv,'text/csv;charset=utf-8');
      alert('Không tải được thư viện Excel (cần kết nối Internet) nên đã xuất file CSV các giao dịch. Excel mở được file này.');
    }catch(e2){alert('Không xuất được file: '+((e2&&e2.message)||e2))}
  }
}
var GR=[['📒','Sổ',['log','stat']],['💰','Tài chính',['bal','cc','loan']],['🏦','Tích lũy',['sav','inv']],['📈','Tổng quan',['plan']],['👨‍👩‍👧','Gia đình',['fam']]],TL={log:'Sổ',stat:'Thống kê',bal:'Số dư',cc:'Tín dụng',loan:'Vay nợ',sav:'Tiết kiệm',inv:'Đầu tư',plan:'Tổng quan',fam:'Gia đình'},LAST={};
function grpOf(t){for(var i=0;i<GR.length;i++)if(GR[i][2].indexOf(t)>=0)return i;return 0}
function navRender(){
  var gi=grpOf(T);LAST[gi]=T;
  document.querySelector('nav').innerHTML=GR.map(function(g,i){return '<button class="'+(i==gi?'on':'')+'" onclick="tab(LAST['+i+']||\''+g[2][0]+'\')"><span>'+g[0]+'</span>'+g[1]+'</button>'}).join('');
}
function subNav(){
  var g=GR[grpOf(T)];if(g[2].length<2)return '';
  return '<div class="card" style="padding:6px"><div class="seg" style="margin:0">'+g[2].map(function(t){return '<button class="'+(t==T?'on':'')+'" onclick="tab(\''+t+'\')">'+TL[t]+'</button>'}).join('')+'</div></div>';
}
var STASH=null;
function restoreAs(nid){
  var o=ME,f=function(a){return a.filter(function(x){return x.by==o}).map(function(x){return Object.assign({},x,{by:nid})})};
  STASH={tx:f(S.tx),loans:f(S.loans),sv:f(S.sv),cc:f(S.cc),inv:f(S.inv)};
  S.tx=S.tx.filter(function(x){return x.by!=o});S.loans=S.loans.filter(function(x){return x.by!=o});S.sv=S.sv.filter(function(x){return x.by!=o});S.cc=S.cc.filter(function(x){return x.by!=o});S.inv=S.inv.filter(function(x){return x.by!=o});
  S.members.forEach(function(m){if(m.c==o)m.c=nid});
  S.members=S.members.filter(function(m){return m.id!=o});
  ME=UID=S.me=nid;
}
function delMember(id){

function mat(v){if(!(v.term>0))return '';var m=dd(v.date);m.setMonth(m.getMonth()+v.term);return ymd(m)}
function svDays(v){var a=dd(v.date),e=dd(v.closed?v.cdate:TODAY);if(!v.closed&&v.term>0){var m=dd(mat(v));if(e>m)e=m}return Math.max(0,Math.round((e-a)/864e5))}
function svVal(v){if(v.closed&&v.payout!=null)return v.payout;return v.amt+v.amt*v.rate/100*svDays(v)/365}
function avail(id){var all=!id||id=='all',F=function(x){return all||x.by==id},d=0;S.inv.filter(F).forEach(function(p){p.ents.forEach(function(e){if(e.bal)d+=e.t=='cap'?e.amt:-e.amt})});S.sv.filter(F).forEach(function(v){d+=v.amt;if(v.closed)d-=svVal(v)});return S.members.filter(function(m){return all||m.id==id}).reduce(function(a,m){return a+(+m.open||0)},0)+sum(S.tx.filter(F),'in')-sum(S.tx.filter(F),'out')-d}
function meM(){return S.members.filter(function(x){return x.id==ME})[0]}
function openSheet(){sheet('<b>Số dư ban đầu</b><p class="mut">Số tiền bạn đang có trước khi bắt đầu ghi sổ (tiền mặt, tài khoản…). Dùng để tính nguồn tiền dư.</p><label>Số tiền (đ)</label><input id="so" type="number" inputmode="numeric" value="'+((meM()||{}).open||'')+'"><button class="pri" onclick="saveOpen()">Lưu</button>')}
function saveOpen(){var m=meM();if(m)m.open=+document.getElementById('so').value||0;save();cl();render()}
function vBal(){
  var rows=[],k,mx=1;
  for(k=0;k<12;k++){var d=new Date(now.getFullYear(),now.getMonth()-k,1),a=ftx(d.getFullYear(),d.getMonth()),i=sum(a,'in'),o=sum(a,'out');if(a.length||k<1)rows.push({l:(d.getMonth()+1)+'/'+d.getFullYear(),i:i,o:o,r:i-o})}
  rows.forEach(function(r){mx=Math.max(mx,Math.abs(r.r))});
  var c=rows[0],sv=S.sv.filter(function(v){return !v.closed&&(FM=='all'||v.by==FM)}).reduce(function(a,v){return a+v.amt},0);
  var h=chips()+'<div class="card"><div class="mut">Còn dư tháng '+c.l+'</div><div style="font-size:26px;font-weight:700" class="'+(c.r<0?'out':'in')+'">'+(c.r<0?'−':'')+vnd(Math.abs(c.r))+'</div><div class="mut">Thu '+vnd(c.i)+' − Chi '+vnd(c.o)+(c.i?' · giữ lại '+Math.round(c.r/c.i*100)+'% thu nhập':'')+'</div></div>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Nguồn tiền dư khả dụng'+(FM=='all'?'':' của '+esc(mnm(FM)))+'</b>'+(FM=='all'||FM==ME?'<button class="sm" onclick="openSheet()">Số dư ban đầu</button>':'')+'</div><div style="font-size:22px;font-weight:700;margin:6px 0">'+vnd(avail(FM))+'</div><div class="mut">= số dư ban đầu + tổng thu − tổng chi − tiền đã chuyển vào sổ tiết kiệm. Đang gửi tiết kiệm: '+vnd(sv)+'.</div><button class="pri" onclick="tab(\'sav\');addSav()">Chuyển vào sổ tiết kiệm</button></div>';
  h+='<div class="card"><b>Còn dư theo tháng</b>';
  rows.forEach(function(r){h+='<div class="row"><div class="grow"><b>Tháng '+r.l+'</b><div class="bar"><div style="width:'+Math.abs(r.r)/mx*100+'%;background:'+(r.r<0?'var(--out)':'var(--in)')+'"></div></div></div><b class="'+(r.r<0?'out':'in')+'">'+(r.r<0?'−':'+')+vnd(Math.abs(r.r))+'</b></div>'});
  return h+'</div>';
}
function addSav(){sheet('<b>Mở sổ tiết kiệm</b><p class="mut">Tiền gửi chỉ được trừ từ số dư của chính bạn. Khả dụng: <b>'+vnd(avail(ME))+'</b></p><label>Tên sổ</label><input id="sn" placeholder="VD: Quỹ mua nhà"><label>Số tiền gửi (đ)</label><input id="sa" type="number" inputmode="numeric"><label>Lãi suất (%/năm)</label><input id="sr" type="number" step="0.01" value="5"><label>Kỳ hạn (tháng, 0 = không kỳ hạn)</label><input id="st" type="number" value="6"><label>Ngày gửi</label><input id="sd" type="date" value="'+TODAY+'"><button class="pri" onclick="saveSav()">Tạo sổ</button>')}
function saveSav(){
  var g=function(x){return document.getElementById(x).value},n=g('sn').trim(),a=parseFloat(g('sa'));
  if(!n||!(a>0))return;
  if(a>avail(ME)){alert('Số tiền vượt quá số dư khả dụng của bạn ('+vnd(avail(ME))+'). Bạn chỉ có thể gửi từ số dư của chính mình.');return}
  S.sv.push({id:Date.now(),by:ME,name:n,amt:a,rate:parseFloat(g('sr'))||0,term:parseInt(g('st'))||0,date:g('sd')||TODAY});save();cl();render();
}
function svById(id){return S.sv.filter(function(v){return v.id==id})[0]}
function closeSav(id){var v=svById(id);if(v&&confirm('Tất toán sổ này? Gốc và lãi sẽ quay về nguồn tiền dư.')){v.payout=Math.round(svVal(v));v.closed=1;v.cdate=TODAY;save();render()}}
function delSav(id){if(confirm('Xoá sổ này? Tiền gốc sẽ quay về nguồn tiền dư.')){S.sv=S.sv.filter(function(v){return v.id!=id});save();render()}}
function vSav(){
  var sf=S.sv.filter(function(v){return FM=='all'||v.by==FM}),op=sf.filter(function(v){return !v.closed}),cl2=sf.filter(function(v){return v.closed}),tp=0,tv=0;
  op.forEach(function(v){tp+=v.amt;tv+=svVal(v)});
  var h=chips()+'<div class="card sum"><div><small>Đang gửi</small><b>'+vnd(tp)+'</b></div><div><small>Lãi tạm tính</small><b class="in">'+vnd(tv-tp)+'</b></div><div><small>Nguồn dư khả dụng</small><b>'+vnd(avail(FM))+'</b></div></div>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Sổ tiết kiệm</b><button class="sm" onclick="addSav()">+ Mở sổ</button></div>';
  if(!op.length)h+='<div class="c mut">Chưa có sổ nào. Tiền gửi sẽ được trừ từ nguồn tiền dư.</div>';
  op.forEach(function(v){var mt=mat(v),val=svVal(v);
    h+='<div class="row" style="align-items:flex-start"><div class="dot" style="background:var(--pri)">🏦</div><div class="grow"><div style="display:flex;justify-content:space-between"><b>'+esc(v.name)+'</b><b>'+vnd(v.amt)+'</b></div><small>'+mn(v.by)+v.rate+'%/năm · '+(v.term?v.term+' tháng':'không kỳ hạn')+' · gửi '+fd(v.date)+(mt?' · đáo hạn '+fd(mt):'')+'</small><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="mut">Hiện ≈ <b class="in">'+vnd(val)+'</b></span>'+(canEd(v.by)?'<span><button class="sm" onclick="closeSav('+v.id+')">Tất toán</button> <button class="chip" onclick="delSav('+v.id+')">Xoá</button></span>':'')+'</div></div></div>'});
  h+='</div>';
  if(cl2.length){h+='<div class="card"><b>Đã tất toán</b>';cl2.forEach(function(v){h+='<div class="row"><div class="grow"><b>'+esc(v.name)+'</b><small>'+mn(v.by)+'gửi '+fd(v.date)+' · tất toán '+fd(v.cdate)+'</small></div><b class="in">'+vnd(v.payout)+'</b></div>'});h+='</div>'}
  return h;
}
var OVM='all';
function mnm(id){var m=S.members.filter(function(x){return x.id==id})[0];return m?m.name:''}
function sgv(n){return (n<0?'−':'')+vnd(Math.abs(n))}
function mtxO(y,m){return mtx(y,m).filter(function(t){return OVM=='all'||t.by==OVM})}
function nw(id){var all=!id||id=='all',F=function(x){return all||x.by==id},s=0,l=0,b=0;
  S.sv.filter(F).forEach(function(v){if(!v.closed)s+=svVal(v)});
  S.loans.filter(F).forEach(function(x){var r=x.amt-paid(x);if(r>0){if(x.kind=='lend')l+=r;else b+=r}});
  var iv=S.inv.filter(F).reduce(function(a,p){return a+invVal(p)},0),cd=S.cc.filter(function(x){return !x.p&&F(x)}).reduce(function(a,x){return a+x.amt},0),c=avail(id);return{c:c,s:s,l:l,b:b,d:cd,i:iv,n:c+s+l-b-cd}}
function ovChips(){return '<div class="card" style="padding:8px"><div style="display:flex;gap:6px;overflow-x:auto">'+[{id:'all',name:'Cả gia đình'}].concat(S.members).map(function(m){return '<button class="chip'+(OVM==m.id?' es':'')+'" style="white-space:nowrap;padding:6px 12px;font-size:13px" onclick="OVM=\''+m.id+'\';render()">'+esc(m.name)+'</button>'}).join('')+'</div></div>'}
function vMembers(){
  if(OVM!='all'||S.members.length<2)return '';
  var rs=S.members.map(function(m,i){return{m:m,i:i,z:nw(m.id)}}),mx=1,tot=0;
  rs.forEach(function(r){mx=Math.max(mx,Math.abs(r.z.n));tot+=r.z.n});
  var df=nw('all').n-tot,h='<div class="card"><b>Tài sản ròng từng tài khoản</b>';
  rs.forEach(function(r){var z=r.z;h+='<div class="row" style="cursor:pointer" onclick="OVM=\''+r.m.id+'\';render()"><div class="dot" style="background:'+COL[r.i%10]+'">'+esc((r.m.name||'?').charAt(0).toUpperCase())+'</div><div class="grow"><div style="display:flex;justify-content:space-between"><b>'+esc(r.m.name)+'</b><b class="'+(z.n<0?'out':'in')+'">'+sgv(z.n)+'</b></div><div class="bar"><div style="width:'+Math.abs(z.n)/mx*100+'%;background:'+COL[r.i%10]+'"></div></div><small>Số dư '+sg(z.c)+' · Tiết kiệm '+sh(z.s)+' · Cho vay '+sh(z.l)+' · Đi vay '+sh(z.b)+'</small></div></div>'});
  if(Math.abs(df)>1)h+='<div class="row"><div class="grow"><b>Chưa gán tài khoản</b><small>Giao dịch của thành viên đã xoá</small></div><b>'+sgv(df)+'</b></div>';
  return h+'<p class="mut" style="margin:8px 0 0">Bấm vào một tài khoản để xem chi tiết và dự đoán riêng. Tổng các tài khoản bằng tài sản ròng cả gia đình.</p></div>';
}
function vAssets(){
  var Z=nw(OVM),cash=Z.c,sv=Z.s,ln=Z.l,bw=Z.b;
  var net=cash+sv+ln-bw-Z.d,it=[['Số dư (tiền dư khả dụng)',cash,'#3e8ed0'],['Tiết kiệm',sv,'#0f9d7a'],['Cho vay (phải thu)',ln,'#7a5af8'],['Đi vay (phải trả)',-bw,'#e5484d'],['Dư nợ thẻ tín dụng',-Z.d,'#d6409f']];
  var pos=it.slice(0,3).filter(function(x){return x[1]>0}),tp=pos.reduce(function(a,x){return a+x[1]},0),acc=0,cs='<circle r="15.9155" cx="20" cy="20" fill="none" stroke="var(--line)" stroke-width="6"/>',mx=1;
  pos.forEach(function(x){var p=x[1]/tp*100;cs+='<circle r="15.9155" cx="20" cy="20" fill="none" stroke="'+x[2]+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90 20 20)"/>';acc+=p});
  it.forEach(function(x){mx=Math.max(mx,Math.abs(x[1]))});
  var h='<div class="card"><div class="mut">'+(OVM=='all'?'Tổng tài sản hiện có (ròng)':'Tài sản ròng của '+esc(mnm(OVM)))+'</div><div style="font-size:26px;font-weight:700" class="'+(net<0?'out':'in')+'">'+(net<0?'−':'')+vnd(Math.abs(net))+'</div><div class="mut">= số dư + tiết kiệm + cho vay − đi vay − nợ thẻ tín dụng (chưa gồm đầu tư, xem bảng riêng bên dưới)</div>';
  h+='<svg viewBox="0 0 40 40" width="170" height="170" style="display:block;margin:8px auto">'+cs+'<text x="20" y="19.5" text-anchor="middle" font-size="2.8" fill="var(--mut)">Tài sản ròng</text><text x="20" y="24" text-anchor="middle" font-size="3.4" font-weight="700" fill="var(--tx)">'+sg(net)+'</text></svg>';
  it.forEach(function(x,i){var p=i<3&&tp>0&&x[1]>0?' <small class="mut">'+Math.round(x[1]/tp*100)+'%</small>':'';
    h+='<div style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span><span style="color:'+x[2]+'">■</span> '+x[0]+p+'</span><b class="'+(x[1]<0?'out':'')+'">'+(x[1]<0?'−':'')+vnd(Math.abs(x[1]))+'</b></div><div class="bar"><div style="width:'+Math.abs(x[1])/mx*100+'%;background:'+x[2]+'"></div></div></div>'});
  return h+'<p class="mut" style="margin:10px 0 0">Biểu đồ tròn chỉ gồm các khoản tài sản dương. Tiết kiệm tính theo giá trị tạm tính hiện tại.</p></div>';
}
function vOv(){if(OVM!='all'&&!mnm(OVM))OVM='all';return ovChips()+vAssets()+vMembers()+vInvTable()+'<div style="margin:4px 16px 8px"><b>Kế hoạch &amp; dự đoán'+(OVM=='all'?'':' của '+esc(mnm(OVM)))+'</b></div>'+vPlan()}
function calc(a){var e=0,o=0;a.forEach(function(t){if(t.type=='out'){if(S.ess[t.cat])e+=t.amt;else o+=t.amt}});return{i:sum(a.filter(function(t){return t.cat=='Lương'}),'in'),e:e,o:o}}
function auto(){var cy=now.getFullYear(),cm=now.getMonth(),arr=[],k,ti=0,te=0,to=0;for(k=1;k<=3;k++){var d=new Date(cy,cm-k,1),a=mtxO(d.getFullYear(),d.getMonth());if(a.length)arr.push(calc(a))}
var di=0,de=arr.length,c=mtxO(cy,cm);
arr.forEach(function(x){ti+=x.i;if(x.i>0)di++;te+=x.e;to+=x.o});
if(c.length){var z=calc(c),fr=now.getDate()/new Date(cy,cm+1,0).getDate();if(z.i>0){ti+=z.i;di++}te+=z.e;to+=z.o;de+=arr.length?fr:Math.max(fr,.3)}
return{n:arr.length+(c.length?1:0),i:di?ti/di:0,e:de?te/de:0,o:de?to/de:0}}
function planSheet(){
  var A=auto(),P=S.plan,f=function(id,l,k,v){return '<label>'+l+'</label><input id="'+id+'" type="number" step="any" inputmode="decimal" value="'+(P[k]!=null?P[k]:'')+'" placeholder="'+(v==null?'0':'Tự tính: '+Math.round(v))+'">'};
  sheet('<b>Chỉnh giả định</b><p class="mut">Để trống = app tự tính từ trung bình các tháng gần nhất.</p>'+f('pi','Lương mỗi tháng (đ)','i',A.i)+f('pe','Chi thiết yếu mỗi tháng (đ)','e',A.e)+f('po','Chi khác mỗi tháng (đ)','o',A.o)+f('pg','Thu nhập tăng mỗi năm (%)','g',0)+f('pf','Chi tiêu tăng mỗi năm / lạm phát (%)','f',0)+'<button class="pri" onclick="savePlan()">Lưu</button>');
}
function savePlan(){['i','e','o','g','f'].forEach(function(k){var x=document.getElementById('p'+(k=='i'?'i':k)).value;if(x==='')delete S.plan[k];else S.plan[k]=+x});save();cl();render()}
function vPlan(){
  var A=auto();if(!A.n)return '<div class="card c mut">Chưa có dữ liệu thu chi để dự đoán. Hãy ghi vài giao dịch trước.</div>';
  var P=OVM=='all'?S.plan:{},I=P.i!=null?P.i:A.i,E=P.e!=null?P.e:A.e,O=P.o!=null?P.o:A.o,g=+P.g||0,f=+P.f||0,b=avail(OVM),rows=[],m,ti=0,te=0,pts=[b],neg='';
  for(m=1;m<=HZ;m++){var gi=Math.pow(1+g/100,m/12),gf=Math.pow(1+f/100,m/12),i=I*gi,e=E*gf,o=O*gf,n=i-e-o;b+=n;ti+=i;te+=e;pts.push(b);if(b<0&&!neg)neg=ms(m);rows.push({l:ms(m),i:i,e:e,o:o,n:n,b:b})}
  var mn2=Math.min.apply(0,pts),mx=Math.max.apply(0,pts),rg=(mx-mn2)||1,line=pts.map(function(v,k){return (k/(pts.length-1||1)*300).toFixed(1)+','+(85-(v-mn2)/rg*80).toFixed(1)}).join(' '),zy=85-(0-mn2)/rg*80;
  var h='<div class="card" style="padding:8px"><div style="display:flex;gap:6px;overflow-x:auto">'+[[1,'1 tháng'],[3,'3 tháng'],[6,'6 tháng'],[12,'1 năm'],[24,'2 năm']].map(function(x){return '<button class="chip'+(HZ==x[0]?' es':'')+'" style="white-space:nowrap;padding:6px 12px;font-size:13px" onclick="HZ='+x[0]+';render()">'+x[1]+'</button>'}).join('')+'</div></div>';
  h+='<div class="card sum"><div><small>Thu dự kiến (lương)</small><b class="in">'+vnd(ti)+'</b></div><div><small>Chi thiết yếu cần</small><b style="color:var(--warn)">'+vnd(te)+'</b></div><div><small>Số dư cuối kỳ</small><b class="'+(b<0?'out':'in')+'">'+(b<0?'−':'')+vnd(Math.abs(b))+'</b></div></div>';
  h+='<div class="card"><b>Số dư dự kiến</b><div class="mut">'+(neg?'⚠ Dự kiến hết tiền dư từ tháng '+neg+'.':'Nguồn tiền dư không bị âm trong kỳ này.')+'</div><svg viewBox="0 0 300 90" width="100%" style="margin-top:6px">'+(mn2<0&&mx>0?'<line x1="0" x2="300" y1="'+zy+'" y2="'+zy+'" stroke="var(--out)" stroke-dasharray="3"/>':'')+'<polyline points="'+line+'" fill="none" stroke="var(--pri)" stroke-width="2"/></svg><div style="display:flex;justify-content:space-between" class="mut"><span>Hiện tại '+sg(pts[0])+'</span><span>Cuối kỳ '+sg(b)+'</span></div></div>';
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Giả định</b>'+(OVM=='all'?'<button class="sm" onclick="planSheet()">Chỉnh</button>':'')+'</div><p class="mut" style="margin:6px 0 0">'+(P.i!=null||P.e!=null||P.o!=null?'Có chỉnh tay. ':'Trung bình '+A.n+' tháng gần nhất (gồm tháng này, tính theo số ngày đã qua). ')+'Lương '+vnd(I)+' · thiết yếu '+vnd(E)+' · khác '+vnd(O)+' mỗi tháng.'+(I==0?' Chưa có khoản thu hạng mục “Lương” nên thu dự kiến = 0: hãy ghi lương hoặc bấm Chỉnh để nhập tay.':' Thu nhập chỉ tính lương, các khoản thu khác không cố định nên không đưa vào.')+(g||f?' Thu tăng '+g+'%/năm, chi tăng '+f+'%/năm.':'')+'</p>'+(Object.keys(S.ess).length?'<p class="mut" style="margin:6px 0 0">Hạng mục thiết yếu: '+Object.keys(S.ess).map(esc).join(', ')+'.</p>':'<p class="mut" style="margin:6px 0 0">Chưa có hạng mục thiết yếu: vào Thống kê để đánh dấu.</p>')+'<p class="mut" style="margin:6px 0 0">Dự đoán tính trên dữ liệu '+(OVM=='all'?'cả gia đình':'riêng tài khoản này')+', chưa gồm lãi sổ tiết kiệm và vay nợ.</p></div>';
  h+='<div class="card" style="overflow-x:auto"><table><tr><th>Tháng</th><th>Thu</th><th>Thiết yếu</th><th>Khác</th><th>Dư</th><th>Số dư</th></tr>';
  rows.forEach(function(r){h+='<tr><td>'+r.l+'</td><td class="in">'+sh(r.i)+'</td><td>'+sh(r.e)+'</td><td>'+sh(r.o)+'</td><td class="'+(r.n<0?'out':'in')+'">'+sg(r.n)+'</td><td class="'+(r.b<0?'out':'')+'"><b>'+sg(r.b)+'</b></td></tr>'});
  return h+'</table></div>';
}
GATE='';render();
if(!S.asked){S.asked=1;save();var m0=S.members.filter(function(m){return m.id==ME})[0];if(m0&&m0.name=='Tôi')memForm(ME)}
</script>
